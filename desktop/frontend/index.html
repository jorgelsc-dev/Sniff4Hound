<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06111d">
    <meta name="msapplication-TileColor" content="#06111d">
    <meta name="msapplication-TileImage" content="%BASE_URL%img/icons/msapplication-icon-144x144.png">
    <meta
      name="description"
      content="Sniff4Hound: sniffer nativo de red con SQLite, estadísticas en vivo y panel operativo."
    >
    <!-- Fonts are bundled (imported in main.js), never fetched at runtime.
         A network-forensics tool has to render identically on an air-gapped
         analyst box: asking fonts.googleapis.com for them on every launch
         both announced to Google that this machine started Sniff4Hound and
         left the whole UI on a generic fallback sans whenever the request
         did not land. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%img/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%img/icons/favicon-16x16.png">
    <link rel="icon" href="%BASE_URL%favicon.ico">
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico">
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
    <link rel="mask-icon" href="%BASE_URL%img/icons/safari-pinned-tab.svg" color="#8e63ff">
    <link rel="manifest" href="%BASE_URL%manifest.json">
    <title>Sniff4Hound</title>
  </head>
  <body>
    <noscript>
      <strong>Sniff4Hound requiere JavaScript habilitado para cargar el panel operativo.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
