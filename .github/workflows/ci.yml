name: CI

# Lint/build plus isolated Electron startup regressions (no app or root), the
# Python dependency install and the strict docs build. The full unit suites
# are not run here. The backend suite took 3-5 minutes on every
# push and pull request, so it lives in tests.yml instead: start it by hand
# from the Actions tab (Tests -> Run workflow), or run it locally (README,
# "Checks").

on:
  # Push only on the long-lived branches. Every auxiliary branch reaches main
  # through a pull request, and the pull_request trigger below already covers
  # it - so listing the branch prefixes here ran every job twice for each push
  # to an open PR, once per event.
  #
  # The usual fix - one concurrency group per branch with cancel-in-progress -
  # is not safe here. The two events would cancel each other, and whichever
  # loses the race is the one that reports: if that is the pull_request run,
  # its check lands as `cancelled` and the pull request shows a red check until
  # someone re-runs it by hand. Not running the duplicate at all has no such
  # failure mode.
  #
  # CI before opening a pull request is still available: open it as a draft.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Desktop no-undef
        working-directory: desktop
        run: frontend/node_modules/.bin/eslint --config eslint.config.cjs main.js preload.js lib/ splash.js --max-warnings=0
      - name: Desktop simulated startup
        run: node --test tests/desktop-*.test.js
      - name: Build
        run: npm run build

  # The landing page is published to GitHub Pages by docs-pages.yml, which only
  # runs on push to main - so until this job existed a broken landing was only
  # discovered after it had already been merged.
  landing-checks:
    name: Landing lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Resolves and installs the Python package the way the .deb and tests.yml do,
  # so a dependency that cannot be fetched (e.g. a git pin to a commit that no
  # longer exists upstream) fails the pull request instead of the first
  # release build after the merge. No tests run here; see tests.yml.
  python-install:
    name: Python install (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install .
      - name: Check installed requirements are consistent
        run: python -m pip check
      # Imports the wsbuilder modules the runtime builds on (HTTP/WS server,
      # QUIC/HTTP3, mDNS, NDJSON logs) without importing sniff4hound.app,
      # which opens the database at import time.
      - name: Import wsbuilder runtime modules
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          from wsbuilder import App, LocalMDNSServer, Request, Response, parse_close_payload  # noqa: F401
          from wsbuilder.http3_server import Http3Server, alt_svc_header  # noqa: F401
          from wsbuilder.logs import NDJSONLog  # noqa: F401
          from wsbuilder.server import HTTPServer  # noqa: F401
          print("wsbuilder", metadata.version("wsbuilder"))
          PY

  # docs-pages.yml only runs on push to main, so a broken link or a page
  # missing from the nav used to be found after the merge. Same build here.
  docs-checks:
    name: Docs strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
      - name: Build site (strict)
        run: mkdocs build --strict
