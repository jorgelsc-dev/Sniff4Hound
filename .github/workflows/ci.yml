name: CI

# Build checks only: lint and production build of the frontend and the landing.
# The unit tests are not run here. The backend suite took 3-5 minutes on every
# push and pull request, so it lives in tests.yml instead: start it by hand
# from the Actions tab (Tests -> Run workflow), or run it locally (README,
# "Checks").

on:
  # Push only on the long-lived branches. Every auxiliary branch reaches main
  # through a pull request, and the pull_request trigger below already covers
  # it - so listing the branch prefixes here ran every job twice for each push
  # to an open PR, once per event.
  #
  # The usual fix - one concurrency group per branch with cancel-in-progress -
  # is not safe here. The two events would cancel each other, and whichever
  # loses the race is the one that reports: if that is the pull_request run,
  # its check lands as `cancelled` and the pull request shows a red check until
  # someone re-runs it by hand. Not running the duplicate at all has no such
  # failure mode.
  #
  # CI before opening a pull request is still available: open it as a draft.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # The landing page is published to GitHub Pages by docs-pages.yml, which only
  # runs on push to main - so until this job existed a broken landing was only
  # discovered after it had already been merged.
  landing-checks:
    name: Landing lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
