name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning is only available for free on public repositories; on a
    # private one it needs GitHub Advanced Security. While this repo is
    # private the analysis itself runs fine but the upload step dies with
    # "Code scanning is not enabled for this repository", failing the whole
    # workflow on every push. Skipping the job keeps the run green and costs
    # nothing, and it starts working on its own the moment the repo is made
    # public - no edit needed. `schedule` events carry no repository object,
    # hence the explicit null-safe comparison.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        uses: github/codeql-action/analyze@v4
