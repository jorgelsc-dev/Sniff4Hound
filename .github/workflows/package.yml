name: Package Debian

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Read-only by default. Only the publish job below gets `contents: write`, and
# it runs no repository code: it downloads the built .deb and calls `gh`.
permissions:
  contents: read

# Every push to main publishes a release, and the version is computed from the
# commits since the newest tag - so two pushes landing close together would
# otherwise run concurrently, compute the same version off the same anchor tag,
# and race to reassign --latest. Queue them instead. cancel-in-progress stays
# false on purpose: cancelling a half-finished run could leave a release
# created but its .deb never uploaded.
concurrency:
  group: package-debian-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release gate: the same suites as the manual Tests workflow (backend shards
  # on the installed package, frontend lint + unit tests). A commit that breaks
  # a test still builds its .deb artifact, but the publish job never runs, so
  # /releases/latest keeps serving the previous verified build.
  tests:
    name: Release gate tests
    uses: ./.github/workflows/tests.yml
    with:
      suite: all
    permissions:
      contents: read

  deb-package:
    name: Build Debian package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.artifact_meta.outputs.name }}
      version: ${{ steps.artifact_meta.outputs.version }}
      arch: ${{ steps.artifact_meta.outputs.arch }}
      deb_file: ${{ steps.artifact_meta.outputs.deb_file }}
      release_tag: ${{ steps.artifact_meta.outputs.release_tag }}
      release_name: ${{ steps.artifact_meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            desktop/package-lock.json

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          npm run build

      # Unlike the frontend above, the desktop app's own `npm ci`/build step
      # runs inside this script (see its BUILD_DESKTOP handling) - it packs
      # the Electron app (desktop/) into the same .deb as the CLI.
      - name: Build Debian package
        run: ./scripts/build_deb.sh

      - name: Show package metadata
        run: dpkg-deb --info "$(find dist -maxdepth 1 -type f -name '*.deb' ! -name '*_latest.deb' | head -n 1)"

      - name: Resolve artifact metadata
        id: artifact_meta
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(pyproject["project"]["version"])
          PY
          )"
          # Deliberately skips the unversioned sniff4hound_latest.deb copy:
          # the release notes and artifact name must name the real version.
          DEB_FILE="$(basename "$(find dist -maxdepth 1 -type f -name '*.deb' ! -name '*_latest.deb' | head -n 1)")"
          ARCH="$(dpkg-deb -f "dist/${DEB_FILE}" Architecture)"
          echo "name=sniff4hound-deb-${VERSION}-${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "arch=${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "deb_file=${DEB_FILE}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_name=Sniff4Hound ${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact_meta.outputs.name }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Debian release
    needs: [tests, deb-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debian artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.deb-package.outputs.name }}
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.deb.sha256

      - name: Publish Debian release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/sniff4hound-release-notes.txt <<EOF
          Debian package release for Sniff4Hound ${{ needs.deb-package.outputs.version }} (${{ needs.deb-package.outputs.arch }}).

          Download the .deb asset from this release and install or update with:

            sudo apt install ./${{ needs.deb-package.outputs.deb_file }}

          Or always fetch the newest release from this permanent URL:

            curl -fL -o sniff4hound_latest.deb \\
              https://github.com/${{ github.repository }}/releases/latest/download/sniff4hound_latest.deb
            sudo apt install ./sniff4hound_latest.deb
          EOF

          if gh release view "${{ needs.deb-package.outputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ needs.deb-package.outputs.release_tag }}" \
              dist/*.deb \
              dist/*.deb.sha256 \
              --repo "${{ github.repository }}" \
              --clobber
            # The permanent /releases/latest/download/ URL only resolves to
            # this release while GitHub marks it "latest" - re-assert it on
            # the re-upload path too, not just on first creation below.
            gh release edit "${{ needs.deb-package.outputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              --latest
          else
            gh release create "${{ needs.deb-package.outputs.release_tag }}" \
              dist/*.deb \
              dist/*.deb.sha256 \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "${{ needs.deb-package.outputs.release_name }}" \
              --notes-file /tmp/sniff4hound-release-notes.txt \
              --latest
          fi
